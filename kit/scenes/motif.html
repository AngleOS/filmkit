<template>
  <!-- The theme's motif draws in on a ground, then settles back so type can sit over it (a title with ground "none"). -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #mo-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="motif" data-composition-variables='[
    {"id":"ground","type":"enum","label":"Ground","default":"ink","options":[{"value":"ink","label":"Ink"},{"value":"accent-dark","label":"Accent, dark"},{"value":"paper","label":"Paper"}]},
    {"id":"dim","type":"number","label":"Settles back at (s, 0 = stays bright)","default":1}
  ]'>
    <svg id="mo-svg" data-layout-ignore></svg>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const v = AL.vars(document.getElementById("root"), window.__hyperframes);
      AL.ground(document.getElementById("root"), v.ground);
      const svg = document.getElementById("mo-svg");
      KM.drawMotif(tl, KB.motif(svg), 0.05);
      if (v.dim > 0) tl.to(svg, { opacity: 0.22, duration: 0.5, ease: "power2.out" }, v.dim);
      window.__timelines["motif"] = tl;
    })();
  </script>
</template>
