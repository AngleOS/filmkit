<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="kit/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/theme/theme.css" />
    <link rel="stylesheet" href="kit/film.css" />
  </head>
  <body>
    <!-- {{film}}: posters, from filmkit's poster template. A 2 s still: the mark assembles over the motif and settles,
         under one line that's on from the first frame. Take the posters with: filmkit stills {{film}} 1.8 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="mark" data-composition-id="mark" data-composition-src="kit/scenes/mark.html" data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics" data-variable-values='{"line":"","contact":0.6}'></div>
      <div id="line" data-composition-id="line" data-composition-src="kit/scenes/title.html" data-start="0" data-duration="2" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"{{name}}, in one *line.*","entrance":"none","place":"head","ground":"none"}'></div>
    </div>
    <script src="kit/layout.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/theme/brand.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
