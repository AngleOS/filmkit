<template>
  <!-- A dot that goes once round a ring of ticks, at one speed: frame `period` is frame 0, so the motion carries on
       across the loop's seam instead of stopping at it. -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #or-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="orbit" data-composition-variables='[
    {"id":"period","type":"number","label":"Seconds for one turn (a loop: its length)","default":8}
  ]'>
    <svg id="or-svg" data-layout-ignore></svg>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const v = AL.vars(document.getElementById("root"), window.__hyperframes);
      const { W, pick, stage } = AL;
      const svg = document.getElementById("or-svg");
      const cx = W / 2, cy = stage.top + stage.height / 2, r = pick({ L: 300, S: 300, V: 360 });
      const ticks = Array.from({ length: 24 }, (_, i) => {
        const a = (i / 24) * 2 * Math.PI, inner = r - (i % 6 ? 14 : 34);
        return `<line x1="${cx + inner * Math.sin(a)}" y1="${cy - inner * Math.cos(a)}" x2="${cx + r * Math.sin(a)}" y2="${cy - r * Math.cos(a)}"/>`;
      }).join("");
      svg.innerHTML = `<g stroke="var(--muted-foreground)" stroke-width="3" opacity="0.5"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none"/>${ticks}</g>`
        + `<g id="or-dot"><circle cx="${cx}" cy="${cy - r}" r="22" fill="var(--accent)"/></g>`;
      tl.fromTo(svg.querySelector("#or-dot"), { rotation: 0 }, { rotation: 360, svgOrigin: `${cx} ${cy}`, duration: v.period, ease: "none" }, 0);
      window.__timelines["orbit"] = tl;
    })();
  </script>
</template>
