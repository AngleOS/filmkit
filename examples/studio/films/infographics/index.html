<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="kit/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/theme/theme.css" />
    <link rel="stylesheet" href="kit/film.css" />
  </head>
  <body>
    <!-- The infographic scenes' smoke film: each one with realistic data under a title placed at the top, so `filmkit
         check infographics` checks them in all four frames. Captions are burned in, to show every chart and source
         line clearing them. Not for posting: the studio's figures are made up, and their source lines say so. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1920" data-height="1080">
      <div id="growth" data-composition-id="growth" data-composition-src="kit/scenes/bars.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"data":"Jan: 12\nFeb: 19\nMar: 26\nApr: 37","highlight":"Apr","axis":"Films shipped a month","ref":30,"refLabel":"the goal","source":"Example data · a studio’s render log, 2026"}'></div>
      <div id="growth-title" data-composition-id="growth-title" data-composition-src="kit/scenes/title.html" data-start="0" data-duration="5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"A film a day, by *April.*","place":"top","ground":"none","entrance":"rise"}'></div>
      <div id="minutes" data-composition-id="minutes" data-composition-src="kit/scenes/bars.html" data-start="5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"data":"Writing the brief: 18\nBuilding the scenes: 42\nChecking four formats: 9\nRendering: 6","direction":"horizontal","highlight":"Building the scenes","suffix":" min","ref":30,"refLabel":"half an hour","ground":"paper","source":"Example data · one 30-second film, start to finish"}'></div>
      <div id="minutes-title" data-composition-id="minutes-title" data-composition-src="kit/scenes/title.html" data-start="5" data-duration="5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Where the *minutes* go.","place":"top","ground":"over-paper","entrance":"rise"}'></div>
      <div id="frames" data-composition-id="frames" data-composition-src="kit/scenes/counter.html" data-start="10" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"value":12480,"lead":"Frames checked before a render","sub":"four formats of a 104-second film","source":"4 formats × 104 s × 30 frames a second"}'></div>
      <div id="frames-title" data-composition-id="frames-title" data-composition-src="kit/scenes/title.html" data-start="10" data-duration="4.5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Every frame, *checked.*","place":"top","ground":"none","entrance":"rise"}'></div>
      <div id="refusals" data-composition-id="refusals" data-composition-src="kit/scenes/stat.html" data-start="14.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"before":28.7,"after":50,"beforeLabel":"Refused, a plain request","afterLabel":"Refused, after “I’m authorized”","ground":"accent-dark","source":"2,390 cyber-defense prompts · arXiv 2603.01246 (2026)"}'></div>
      <div id="refusals-title" data-composition-id="refusals-title" data-composition-src="kit/scenes/title.html" data-start="14.5" data-duration="5.5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Asking nicely made it *worse.*","place":"top","ground":"none","entrance":"rise"}'></div>
      <div id="first-try" data-composition-id="first-try" data-composition-src="kit/scenes/grid.html" data-start="20" data-duration="5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"total":24,"lit":17,"label":"17 of 24 films","sub":"passed check on the first try","ground":"paper","source":"Example data · a studio’s last 24 films"}'></div>
      <div id="first-try-title" data-composition-id="first-try-title" data-composition-src="kit/scenes/title.html" data-start="20" data-duration="5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Most pass the *first* time.","place":"top","ground":"over-paper","entrance":"rise"}'></div>
      <div id="checks" data-composition-id="checks" data-composition-src="kit/scenes/cards.html" data-start="25" data-duration="5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"cards":"search | Every frame is checked. | Four formats, 30 frames a second\nshield | Captions stay clear. | Of each feed’s buttons and safe zone\ncheck | Sound is cut to the picture. | Each hit lands on its frame","highlight":3,"source":"Example data · what filmkit check looks for"}'></div>
      <div id="checks-title" data-composition-id="checks-title" data-composition-src="kit/scenes/title.html" data-start="25" data-duration="5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Three checks before *a render.*","place":"top","ground":"none","entrance":"rise"}'></div>
      <div id="years" data-composition-id="years" data-composition-src="kit/scenes/timeline.html" data-start="30" data-duration="5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"ticks":"2019 | The first film\n2023 | Captions burned in\n2025 | Four formats\n2026 | The kit","spacing":"scale","highlight":"2026","ground":"accent-dark","source":"Example data · a studio’s history"}'></div>
      <div id="years-title" data-composition-id="years-title" data-composition-src="kit/scenes/title.html" data-start="30" data-duration="5" data-track-index="2" data-track-kind="graphics" data-variable-values='{"text":"Seven years to *a kit.*","place":"top","ground":"none","entrance":"rise"}'></div>
      <div id="captions" data-composition-id="captions" data-composition-src="kit/scenes/captions.html" data-start="0" data-duration="35" data-track-index="4" data-track-kind="captions" data-variable-values='{"lines":"0.5-4.8 Films shipped each month passed the goal in April.\n5.5-9.8 Most of a film’s time goes into building its scenes.\n10.5-14.3 Every frame of every format is checked before a render.\n15-19.8 Saying “I’m authorized” raised refusals from 28.7% to 50%.\n20.5-24.8 Seventeen of the last 24 films passed check on the first try.\n25.5-29.8 Every frame, the captions and the sound are checked before a render.\n30.5-34.8 Seven years from the first film to the kit.","burn":true}'></div>
    </div>
    <script src="kit/layout.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/chart.js"></script>
    <script src="kit/icons.js"></script>
    <script src="kit/theme/brand.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
