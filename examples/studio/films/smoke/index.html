      <div id="section" data-composition-id="section" data-composition-src="kit/scenes/title.html" data-start="5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"Built from the *kit.*","entrance":"rise","ground":"accent-dark"}'></div>

    <script src="kit/layout.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/theme/brand.js"></script>

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

</html>
