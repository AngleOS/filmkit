<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="kit/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/theme/theme.css" />
    <link rel="stylesheet" href="kit/film.css" />
  </head>
  <body>
    <!-- The kit's smoke film: every kit scene but the infographics (the infographics film mounts those), so `filmkit
         check smoke` checks them in all four frames. Not for posting. Later hosts paint over earlier ones. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.5" data-width="1920" data-height="1080">
      <div id="poster" data-composition-id="poster" data-composition-src="kit/scenes/title.html" data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"Films are *code*\nnow.","entrance":"none"}'></div>
      <div id="statement" data-composition-id="statement" data-composition-src="kit/scenes/title.html" data-start="2.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"One master,\nfour *frames.*","sub":"Each laid out for its own."}'></div>
      <div id="section" data-composition-id="section" data-composition-src="kit/scenes/title.html" data-start="5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"Built from the *kit.*","entrance":"rise","ground":"accent-dark"}'></div>
      <div id="promise" data-composition-id="promise" data-composition-src="kit/scenes/title.html" data-start="7.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"Light grounds read *too.*","entrance":"ink","ground":"paper"}'></div>
      <div id="headline" data-composition-id="headline" data-composition-src="kit/scenes/title.html" data-start="10" data-duration="3" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"A title at the top,\nover a *product* shot.","place":"top"}'></div>
      <div id="who" data-composition-id="who" data-composition-src="kit/scenes/lower-third.html" data-start="10.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"name":"Lower thirds","role":"Over any shot","out":2.2}'></div>
      <div id="motif" data-composition-id="motif" data-composition-src="kit/scenes/motif.html" data-start="13" data-duration="3" data-track-index="1" data-track-kind="graphics"></div>
      <div id="over-motif" data-composition-id="over-motif" data-composition-src="kit/scenes/title.html" data-start="13" data-duration="3" data-track-index="1" data-track-kind="graphics" data-variable-values='{"text":"A motif from the *theme.*","ground":"none","entrance":"rise"}'></div>
      <div id="mark" data-composition-id="mark" data-composition-src="kit/scenes/mark.html" data-start="16" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-variable-values='{"line":"The logo, *revealed.*"}'></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/scenes/endcard.html" data-start="19.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-variable-values='{"claim":"Every frame, *checked.*","cta":"example.com"}'></div>
      <div id="captions" data-composition-id="captions" data-composition-src="kit/scenes/captions.html" data-start="0" data-duration="25.5" data-track-index="4" data-track-kind="captions" data-variable-values='{"lines":"0.3-2.3 Captions ship as SRT and VTT files.\n5.2-7.3 With burn, they are in the picture too.","burn":true}'></div>
    </div>
    <script src="kit/layout.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/theme/brand.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
