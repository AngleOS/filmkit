<template>
  <!-- The review: a 9:16 contact sheet in the ui scene's window (AL.app("stage").body), four frames under their labels
       as `filmkit contact` writes them. In the third, a chart's source line sits in the caption block: a box flags it,
       the line moves up clear of the captions, and the flag reads fixed. The frames are drawn as blocks (title, bars,
       source line, captions), so nothing in them is type under 28 px. The theme has no error colour: the flag is in
       the accent. -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    .rv-frame { position: absolute; background: var(--ink); border: 2px solid var(--fk-border); border-radius: 8px; overflow: hidden; }
    .rv-frame i { position: absolute; border-radius: 4px; background: var(--foreground); }
    .rv-frame i.bar { background: var(--muted-foreground); }
    .rv-frame i.lit { background: var(--accent); }
    .rv-frame i.src { background: var(--muted-foreground); opacity: 0.8; }
    .rv-frame i.cap { background: var(--fk-muted); border-radius: 6px; }
    .rv-label { position: absolute; font: 500 28px var(--font-mono); color: var(--muted-foreground); text-align: center; white-space: nowrap; }
    #rv-flag { position: absolute; border: 4px solid var(--accent); border-radius: 10px; }
    #rv-note { position: absolute; font: 500 28px var(--font-ui); white-space: nowrap; }
    #rv-note > div { position: absolute; left: 0; top: 0; display: flex; gap: 12px; align-items: center; }
    #rv-bad { color: var(--foreground); }
    #rv-good { color: var(--accent); }
  </style>
  <div id="root" data-composition-id="review">
    <div class="rv-frame"></div>
    <div class="rv-frame"></div>
    <div class="rv-frame"></div>
    <div class="rv-frame"></div>
    <div class="rv-label"><span>9x16 0.7s</span></div>
    <div class="rv-label"><span>9x16 5.2s</span></div>
    <div class="rv-label"><span>9x16 8.4s</span></div>
    <div class="rv-label"><span>9x16 11.2s</span></div>
    <div id="rv-flag"></div>
    <div id="rv-note"><div id="rv-bad"><span>source line under caption box</span></div><div id="rv-good"><span>fixed: source line under caption box</span></div></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const { pick } = AL;
      const $ = (id) => document.getElementById(id);
      const B = AL.app("stage").body;
      const frames = [...document.querySelectorAll(".rv-frame")], labels = document.querySelectorAll(".rv-label");
      // Four 9:16 frames, in one row or two, whichever draws them larger over their labels and the note, centred in
      // the body.
      const gap = pick({ L: 40, S: 20, V: 16 }), pad = pick({ L: 48, S: 28, V: 20 }), label = 48, note = 72;
      const size = (/** @type {number} */ cols) => {
        const rows = 4 / cols, tall = (B.height - 2 * pad - rows * label - note - (rows - 1) * gap) / rows;
        return Math.min((B.width - 2 * pad - (cols - 1) * gap) / cols, (tall * 9) / 16);
      };
      const cols = size(4) >= size(2) ? 4 : 2, fw = size(cols), fh = (fw * 16) / 9;
      const rows = 4 / cols, high = rows * (fh + label) + (rows - 1) * gap + note;
      const left = B.left + (B.width - cols * fw - (cols - 1) * gap) / 2, top = B.top + (B.height - high) / 2;
      const at = (/** @type {number} */ i) => ({ left: left + (i % cols) * (fw + gap), top: top + Math.floor(i / cols) * (fh + label + gap) });

      // A frame's blocks as fractions of it: a title, a chart's bars (the third frame's chart), its source line and two
      // caption lines in the caption block at the feed's floor.
      /** @param {number} x @param {number} y @param {number} w @param {number} h @param {string} kind */
      const block = (x, y, w, h, kind = "") => `<i class="${kind}" style="left:${x * fw}px;top:${y * fh}px;width:${w * fw}px;height:${h * fh}px"></i>`;
      const caption = block(0.12, 0.7, 0.76, 0.03, "cap") + block(0.2, 0.74, 0.6, 0.03, "cap");
      const title = (w) => block(0.08, 0.16, w, 0.035) + block(0.08, 0.205, w * 0.6, 0.035);
      const bars = [0.18, 0.26, 0.34, 0.5].map((h, i) => block(0.12 + i * 0.2, 0.62 - h, 0.14, h, i === 3 ? "bar lit" : "bar")).join("");
      frames[0].innerHTML = title(0.8) + caption;
      frames[1].innerHTML = title(0.7) + block(0.08, 0.32, 0.84, 0.2, "bar") + caption;
      frames[2].innerHTML = title(0.75) + bars + block(0.2, 0.715, 0.6, 0.016, "src") + caption;
      frames[3].innerHTML = title(0.6) + block(0.3, 0.36, 0.4, 0.06, "lit") + caption;
      // The flag's note carries the alert icon; the fix's, a check.
      $("rv-bad").insertAdjacentHTML("afterbegin", KI.svg("triangle-alert", 32));
      $("rv-good").insertAdjacentHTML("afterbegin", KI.svg("check", 32));
      frames.forEach((el, i) => gsap.set(el, { ...at(i), width: fw, height: fh }));
      labels.forEach((el, i) => gsap.set(el, { left: at(i).left - gap / 2, width: fw + gap, top: at(i).top + fh + 8 }));

      // The flag rings the source line and the caption block it sits in.
      const third = at(2);
      gsap.set($("rv-flag"), { left: third.left + 0.06 * fw, top: third.top + 0.68 * fh, width: 0.88 * fw, height: 0.11 * fh });
      gsap.set($("rv-note"), { left, top: at(3).top + fh + label + 12 });

      KM.arrive(tl, frames, 0.3);
      tl.fromTo(labels, { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.06, ease: "none" }, 0.6);
      tl.fromTo($("rv-flag"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.6);
      tl.fromTo($("rv-bad"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 1.8);
      // The fix: the source line moves up to the chart's floor, clear of the captions, and the flag clears.
      tl.to(frames[2].querySelector(".src"), { y: -0.075 * fh, duration: 0.6, ease: "expo.out" }, 3.8);
      tl.to($("rv-flag"), { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.0);
      tl.to($("rv-bad"), { opacity: 0, duration: 0.2, ease: "none" }, 4.0);
      tl.fromTo($("rv-good"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 4.2);
      window.__timelines["review"] = tl;
    })();
  </script>
</template>
