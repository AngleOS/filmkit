name: "Task"
description: "A concrete piece of work (ops, chore, follow-up)"
type: Task
projects: ["AngleOS/5"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What"
      description: "The work, small enough for one PR or one sitting."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: "Done when"
      placeholder: "- [ ] …"
  - type: input
    id: kb
    attributes:
      label: "Related kb page"
      description: "Vault path, e.g. projects/every-election/02 - Decisions"
