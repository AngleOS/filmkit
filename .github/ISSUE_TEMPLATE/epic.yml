name: "Epic"
description: "A body of work made of sub-issues (like a Linear project)"
type: Epic
projects: ["AngleOS/5"]
body:
  - type: markdown
    attributes:
      value: "Add the pieces as **sub-issues** (Create sub-issue, right sidebar). Progress shows on the board; set **Due date** there to put it on the Roadmap."
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "The outcome, in one or two sentences."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope / not in scope"
  - type: input
    id: kb
    attributes:
      label: "kb page"
      description: "The page that holds the plan and decisions"
