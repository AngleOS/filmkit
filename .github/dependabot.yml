version: 2
# One grouped PR a week per ecosystem. HyperFrames isn't an npm dependency (src/hyperframes.js pins it for npx), so
# it moves by hand, after checking every example film.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  # The SHA-pinned actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
