name: release

# A `v*` tag publishes that version to npm with provenance. Until the owner adds the NPM_TOKEN secret and makes the
# repo public (npm refuses provenance from a private one; both filmkit#15) it runs a dry run and says so.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # provenance: the signed statement of which workflow built the package

jobs:
  publish:
    # The one GitHub-hosted job, unlike ci.yml: npm accepts provenance only from a cloud-hosted runner. A couple of
    # minutes a release, within the plan's included minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: the tag is package.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG, but package.json's version is $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            npm publish --dry-run --provenance --access public
            echo "::notice::No NPM_TOKEN secret: a dry run only. Publishing waits on the owner (filmkit#15)."
            exit 0
          fi
          npm publish --provenance --access public
