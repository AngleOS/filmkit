name: release

# A `v*` tag publishes that version to npm by trusted publishing: npm takes this workflow's OIDC token instead of a
# stored one (npm no longer lets a token skip 2FA) and attaches provenance itself. The package's trusted publisher on
# npmjs.com names AngleOS/filmkit and release.yml; the first version (0.1.0) was published by hand, since npm only
# trusts a workflow for a package that already exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing: npm takes this run's OIDC token in place of a stored one

jobs:
  publish:
    # The one GitHub-hosted job, unlike ci.yml: npm accepts provenance only from a cloud-hosted runner. A couple of
    # minutes a release, within the plan's included minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: the tag is package.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG, but package.json's version is $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
