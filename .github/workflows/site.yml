name: site

# The marketing one-pager (site/): lint, types, tests with axe, the static build, and Lighthouse (mobile) asserted at
# 0.95+ for performance, best practices and SEO and 1.0 for accessibility (site/lighthouserc.json). On master it deploys
# to GitHub Pages at https://angleos.github.io/filmkit/. Self-hosted runners only (AngleOS CI policy); Lighthouse needs
# x64 Chrome, which the runner image has.
on:
  pull_request:
    paths: ['site/**', 'docs/install-with-your-agent.md', '.github/workflows/site.yml']
  push:
    branches: [master]
    paths: ['site/**', 'docs/install-with-your-agent.md', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, ci, Linux, X64]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ ships without corepack: install the pnpm package.json pins.
      - run: npm install -g pnpm@10.27.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Lighthouse, mobile (performance, best practices, SEO >= 0.95; accessibility 1.0)
        env:
          LH_PERF_WARN_ONLY: "1"   # shared self-hosted runners: performance recorded, not asserted
        # a free port: runners share hosts, so a fixed one could audit another job's server
        run: |
          export PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          export SITE_ORIGIN=http://localhost:$PORT
          pnpm start &
          timeout 60 sh -c "until curl -sf $SITE_ORIGIN/ > /dev/null; do sleep 1; done"
          pnpm lighthouse

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: [self-hosted, ci, Linux, X64]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm install -g pnpm@10.27.0
      - run: pnpm install --frozen-lockfile
      - name: Build for Pages (/filmkit)
        env:
          SITE_BASE_PATH: /filmkit
        run: pnpm build && touch out/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # A Pages artifact is a few MB and kept a day, well inside the account's artifact quota.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
